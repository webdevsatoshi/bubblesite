<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AvaTexts</title>
  <script>
    (function() {
      var match = window.location.pathname.match(/^\/subscribe\/([A-Za-z0-9_-]+)\/?$/);
      if (match) {
        window.location.replace('/subscribe?ref=' + encodeURIComponent(match[1]));
        return;
      }

      window.location.replace('/');
    })();
  </script>
</head>
<body></body>
</html>

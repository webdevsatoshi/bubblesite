<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AvaTexts</title>
  <script>
    (function() {
      var path = window.location.pathname.replace(/\/+$/, '');
      var cleanRoutes = {
        '/subscribe': '/subscribe/index.html',
        '/faq': '/faq/index.html',
        '/privacy': '/privacy/index.html',
        '/terms': '/terms/index.html'
      };
      var subscribeRef = path.match(/^\/subscribe\/([A-Za-z0-9_-]+)$/);

      if (subscribeRef) {
        window.location.replace('/subscribe?ref=' + encodeURIComponent(subscribeRef[1]));
        return;
      }

      if (cleanRoutes[path]) {
        window.location.replace(cleanRoutes[path]);
        return;
      }

      window.location.replace('/');
    })();
  </script>
</head>
<body></body>
</html>
